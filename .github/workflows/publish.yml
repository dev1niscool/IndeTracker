name: Refresh news and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify search and offline refresh
        run: node --test tests/test_search.mjs tests/test_worker.mjs
      - name: Verify source filtering and site files
        run: python -m unittest discover -s tests -v
      - name: Check publisher feeds
        id: refresh
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Retain the archive and check status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh publisher feeds and update check status"
            if ! git push; then
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report a failed source check after publishing the saved archive
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "All source feeds were unavailable. The saved archive and failure status were published."
          exit 1
